name: Automated Release Pipeline

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x86_64
          - target: aarch64-pc-windows-msvc
            arch_name: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Extract Version Tag
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          Write-Host "Detected tag: $tag"
          "version_tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Zip Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.version_tag }}"
          $dist = "dist-${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          
          $staging = "$dist/staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/wstrace.exe" "$staging/wstrace.exe"
          Copy-Item "README.md" "$staging/README.md"
          Copy-Item "LICENSE" "$staging/LICENSE"
          
          $zipName = "wstrace-$tag-windows-${{ matrix.arch_name }}.zip"
          $zipPath = "$dist/$zipName"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath -Force
          Remove-Item -Path $staging -Recurse -Force
          
          # Compute SHA-256
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$dist/checksum.txt" -Encoding ascii
          Write-Host "Archive created: $zipName with SHA256: $hash"

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.arch_name }}
          path: dist-${{ matrix.arch_name }}/*

  create-draft-release:
    name: Create Draft Release (Human Verification Gate)
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - uses: actions/checkout@v7

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Aggregate Checksums and Organize Assets
        shell: bash
        run: |
          mkdir -p final-assets
          find release-assets/ -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -name "checksum.txt" -exec cat {} + > final-assets/SHA256SUMS.txt
          cat final-assets/SHA256SUMS.txt

      - name: Extract Tag Name
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "wstrace ${{ steps.release_tag.outputs.tag }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*.zip
            final-assets/SHA256SUMS.txt

      - name: Synchronize Packaging Manifests to Main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          
          HASH_X86_64=$(grep -i "windows-x86_64.zip" final-assets/SHA256SUMS.txt | awk '{print $1}' | head -n 1)
          HASH_ARM64=$(grep -i "windows-aarch64.zip" final-assets/SHA256SUMS.txt | awk '{print $1}' | head -n 1)
          
          if [ -z "$HASH_X86_64" ] || [ -z "$HASH_ARM64" ]; then
            echo "Error: Failed to extract required SHA256 checksums from final-assets/SHA256SUMS.txt" >&2
            exit 1
          fi
          
          echo "Synchronizing manifests for release $TAG (x86_64: $HASH_X86_64, arm64: $HASH_ARM64)"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Checkout origin/main to guarantee clean sync commit without rebase conflicts
          git fetch origin main
          git checkout -B sync-work origin/main
          
          TAG="$TAG" VERSION="$VERSION" HASH_X86_64="$HASH_X86_64" HASH_ARM64="$HASH_ARM64" python3 -c "
          import os, sys, re, json

          tag = os.environ.get('TAG', '')
          version = os.environ.get('VERSION', '')
          hash_x64 = os.environ.get('HASH_X86_64', '')
          hash_arm64 = os.environ.get('HASH_ARM64', '')

          # 1. Update Scoop manifest
          scoop_path = 'packaging/scoop/wstrace.json'
          if not os.path.exists(scoop_path):
              sys.exit(f'Error: Scoop manifest not found at {scoop_path}')

          with open(scoop_path, 'r', encoding='utf-8') as f:
              d = json.load(f)
          d['version'] = version
          arch = d.setdefault('architecture', {})
          arch.setdefault('64bit', {})['url'] = f'https://github.com/gilnett/wstrace/releases/download/{tag}/wstrace-{tag}-windows-x86_64.zip'
          arch['64bit']['hash'] = hash_x64
          arch.setdefault('arm64', {})['url'] = f'https://github.com/gilnett/wstrace/releases/download/{tag}/wstrace-{tag}-windows-aarch64.zip'
          arch['arm64']['hash'] = hash_arm64
          with open(scoop_path, 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2)
              f.write('\n')

          # 2. Update Winget manifest
          winget_path = 'packaging/winget/wstrace.yaml'
          if not os.path.exists(winget_path):
              sys.exit(f'Error: Winget manifest not found at {winget_path}')

          with open(winget_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'(?m)^PackageVersion:\s*\S+', f'PackageVersion: {version}', content)

          def update_winget_arch(text, arch, url, sha):
              pattern = rf'(- Architecture:\s*{arch}\b[\s\S]*?)(?=\n\s*- Architecture:|\Z)'
              def repl(m):
                  block = m.group(1)
                  block = re.sub(r'(?m)^(\s*InstallerUrl:\s*)\S+', rf'\g<1>{url}', block)
                  block = re.sub(r'(?m)^(\s*InstallerSha256:\s*)\S+', rf'\g<1>{sha}', block)
                  return block
              return re.sub(pattern, repl, text)

          url_x64 = f'https://github.com/gilnett/wstrace/releases/download/{tag}/wstrace-{tag}-windows-x86_64.zip'
          content = update_winget_arch(content, 'x64', url_x64, hash_x64)

          if hash_arm64:
              url_arm64 = f'https://github.com/gilnett/wstrace/releases/download/{tag}/wstrace-{tag}-windows-aarch64.zip'
              content = update_winget_arch(content, 'arm64', url_arm64, hash_arm64)

          with open(winget_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          
          git add packaging/scoop/wstrace.json packaging/winget/wstrace.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(packaging): sync release sha256 checksums for $TAG [skip ci]"
            
            if ! git push origin sync-work:main; then
              echo "Direct push to main rejected by branch protection. Creating synchronization pull request..."
              SYNC_BRANCH="chore/sync-manifests-$TAG"
              git branch -M "$SYNC_BRANCH"
              git push -u origin "$SYNC_BRANCH" --force-with-lease
              gh pr create \
                --title "chore(packaging): sync release sha256 checksums for $TAG" \
                --body "Automated release checksum synchronization for $TAG release assets." \
                --base main \
                --head "$SYNC_BRANCH" || true
            fi
          fi
