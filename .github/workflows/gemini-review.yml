name: Gemini AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    name: Gemini Automated Code Review
    runs-on: ubuntu-latest
    if: github.repository == 'gilnett/wstrace'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate PR Review with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log("No GEMINI_API_KEY found in secrets. Skipping review.");
              return;
            }

            // 1. Get PR Diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            if (!diff || diff.length === 0) {
              console.log("Empty diff. Skipping review.");
              return;
            }

            const truncatedDiff = diff.slice(0, 80000);

            const promptParts = [
              "You are an expert Rust systems programmer reviewing a Pull Request for 'wstrace' (a Windows system, Win32 API, and Process Monitor CLI written in native Rust).",
              "Review the following git diff carefully.",
              "",
              "Structure your response with:",
              "1. **Summary of Changes**: High-level summary of architectural and functional changes.",
              "2. **Code Quality & Rust Idioms**: Evaluation against modern Rust idioms, safety, error handling, and performance.",
              "3. **Potential Issues / Edge Cases**: Point out any potential bugs, memory leaks, concurrency issues, or Win32 API gotchas.",
              "4. **Verdict**: Clear recommendation (LGTM / Needs Attention).",
              "",
              "Keep your response constructive, professional, and well-structured in GitHub Markdown.",
              "",
              "GIT DIFF:",
              "```diff",
              truncatedDiff,
              "```"
            ];
            const prompt = promptParts.join("\n");

            // 2. Call Gemini 3.8 Flash API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 2048
                }
              })
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Gemini API error: ${response.status} ${errText}`);
            }

            const data = await response.json();
            const reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!reviewText) {
              throw new Error("No review text generated by Gemini.");
            }

            const header = "### 🤖 Gemini AI Code Review\n\n";
            const footer = "\n\n---\n*Generated automatically by Google Gemini 3.8 Flash via GitHub Actions.*";

            // 3. Post comment to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: header + reviewText + footer
            });

            console.log("Successfully posted Gemini review to PR #" + context.issue.number);
