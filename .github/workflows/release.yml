name: Automated Release Pipeline

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x86_64
          - target: aarch64-pc-windows-msvc
            arch_name: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Extract Version Tag
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          Write-Host "Detected tag: $tag"
          "version_tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Zip Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.version_tag }}"
          $dist = "dist-${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          
          $staging = "$dist/staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/wstrace.exe" "$staging/wstrace.exe"
          Copy-Item "README.md" "$staging/README.md"
          Copy-Item "LICENSE" "$staging/LICENSE"
          
          $zipName = "wstrace-$tag-windows-${{ matrix.arch_name }}.zip"
          $zipPath = "$dist/$zipName"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath -Force
          Remove-Item -Path $staging -Recurse -Force
          
          # Compute SHA-256
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$dist/checksum.txt" -Encoding ascii
          Write-Host "Archive created: $zipName with SHA256: $hash"

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.arch_name }}
          path: dist-${{ matrix.arch_name }}/*

  create-draft-release:
    name: Create Draft Release (Human Verification Gate)
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - uses: actions/checkout@v7

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Aggregate Checksums and Organize Assets
        shell: bash
        run: |
          mkdir -p final-assets
          find release-assets/ -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -name "checksum.txt" -exec cat {} + > final-assets/SHA256SUMS.txt
          cat final-assets/SHA256SUMS.txt

      - name: Extract Tag Name
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "wstrace ${{ steps.release_tag.outputs.tag }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*.zip
            final-assets/SHA256SUMS.txt

      - name: Synchronize Packaging Manifests to Main
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          
          HASH_X86_64=$(grep -i "windows-x86_64.zip" final-assets/SHA256SUMS.txt | awk '{print $1}' | head -n 1)
          HASH_ARM64=$(grep -i "windows-aarch64.zip" final-assets/SHA256SUMS.txt | awk '{print $1}' | head -n 1)
          
          echo "Synchronizing manifests for release $TAG (x86_64: $HASH_X86_64, arm64: $HASH_ARM64)"
          
          if [ -f "packaging/winget/wstrace.yaml" ] && [ -n "$HASH_X86_64" ]; then
            sed -i -E "s/PackageVersion: .*/PackageVersion: $VERSION/" packaging/winget/wstrace.yaml
            sed -i -E "s|https://github.com/gilnett/wstrace/releases/download/[^/]+/wstrace-[^/]+-windows-x86_64.zip|https://github.com/gilnett/wstrace/releases/download/$TAG/wstrace-$TAG-windows-x86_64.zip|" packaging/winget/wstrace.yaml
            sed -i -E "s/InstallerSha256: [a-fA-F0-9]{64}/InstallerSha256: $HASH_X86_64/" packaging/winget/wstrace.yaml
          fi
          
          if [ -f "packaging/scoop/wstrace.json" ] && [ -n "$HASH_X86_64" ] && [ -n "$HASH_ARM64" ]; then
            python3 -c "
          import json
          with open('packaging/scoop/wstrace.json', 'r') as f:
              d = json.load(f)
          d['version'] = '$VERSION'
          if 'architecture' not in d: d['architecture'] = {}
          if '64bit' not in d['architecture']: d['architecture']['64bit'] = {}
          if 'arm64' not in d['architecture']: d['architecture']['arm64'] = {}
          d['architecture']['64bit']['url'] = f'https://github.com/gilnett/wstrace/releases/download/$TAG/wstrace-$TAG-windows-x86_64.zip'
          d['architecture']['64bit']['hash'] = '$HASH_X86_64'
          d['architecture']['arm64']['url'] = f'https://github.com/gilnett/wstrace/releases/download/$TAG/wstrace-$TAG-windows-aarch64.zip'
          d['architecture']['arm64']['hash'] = '$HASH_ARM64'
          with open('packaging/scoop/wstrace.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          "
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/scoop/wstrace.json packaging/winget/wstrace.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(packaging): sync release sha256 checksums for $TAG [skip ci]"
            git push origin HEAD:main
          fi
