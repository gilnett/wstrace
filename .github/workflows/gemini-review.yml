name: Gemini AI PR Review

on:
  pull_request:
    types: [opened]
    branches: [ main ]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    name: Gemini Automated Code Review
    runs-on: ubuntu-latest
    if: >
      github.repository == 'gilnett/wstrace' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.comment.body, '@gemini review'))
      )
    steps:
      - name: Generate PR Review with Gemini
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log("No GEMINI_API_KEY found in secrets. Skipping review.");
              return;
            }

            // Acknowledge command comment with emoji reaction
            if (context.eventName === 'issue_comment' && context.payload.comment) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                });
              } catch (_) {}
            }

            // 1. Check review quota (max 3 reviews per 24-hour rolling window)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const reviewsLast24h = comments.filter(c =>
              c.body &&
              c.body.includes('Gemini AI Code Review') &&
              new Date(c.created_at) > oneDayAgo
            );

            const maxReviewsPerDay = 3;
            const totalPreviousReviews = comments.filter(c =>
              c.body && c.body.includes('Gemini AI Code Review')
            ).length;
            const reviewIndex = totalPreviousReviews + 1;

            const isMaintainer = context.payload.comment && (
              context.payload.comment.author_association === 'OWNER' ||
              context.payload.comment.author_association === 'COLLABORATOR' ||
              context.payload.comment.user?.login === context.repo.owner
            );

            const userRequestedForce = context.eventName === 'issue_comment' &&
              context.payload.comment &&
              context.payload.comment.body.includes('force');

            const isForce = userRequestedForce && isMaintainer;

            if (reviewsLast24h.length >= maxReviewsPerDay && !isForce) {
              console.log(`Daily review quota reached (${reviewsLast24h.length}/${maxReviewsPerDay} in last 24h). Skipping review.`);
              if (context.eventName === 'issue_comment') {
                const unauthorizedNotice = userRequestedForce && !isMaintainer
                  ? `\n\n> [!WARNING]\n> \`@gemini review force\` is restricted to repository maintainers.`
                  : ``;
                const maintainerHint = isMaintainer
                  ? ` (maintainer override: comment \`@gemini review force\` to bypass).`
                  : `.`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `> [!NOTE]\n> **Gemini AI Review Daily Quota Reached**: This Pull Request has received ${reviewsLast24h.length}/${maxReviewsPerDay} reviews in the past 24 hours. The quota resets automatically on a 24-hour rolling window${maintainerHint}${unauthorizedNotice}`
                });
              }
              return;
            }

            // 2. Fetch PR Diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            if (!diff || diff.length === 0) {
              console.log("Empty diff. Skipping review.");
              return;
            }

            // Filter out noise files (lockfiles, assets) to save tokens and focus on code
            const cleanedDiff = diff
              .split(/^diff --git /m)
              .filter(chunk => {
                if (!chunk) return false;
                const headerLine = chunk.split('\n')[0] || '';
                return !headerLine.includes('Cargo.lock') && !headerLine.includes('.svg') && !headerLine.includes('.zip');
              })
              .map(chunk => 'diff --git ' + chunk)
              .join('');

            const diffToReview = (cleanedDiff && cleanedDiff.length > 0) ? cleanedDiff : diff;
            let truncatedDiff = diffToReview;
            if (diffToReview.length > 60000) {
              const slice = diffToReview.slice(0, 60000);
              const lastFileBoundary = slice.lastIndexOf('\ndiff --git ');
              if (lastFileBoundary > 10000) {
                truncatedDiff = slice.slice(0, lastFileBoundary) + "\n\n[... DIFF TRUNCATED BY WORKFLOW AT FILE BOUNDARY TO FIT TOKEN BUDGET - REMAINING FILES OMITTED ...]";
              } else {
                const lastLineBoundary = slice.lastIndexOf('\n');
                truncatedDiff = slice.slice(0, lastLineBoundary) + "\n\n[... DIFF TRUNCATED BY WORKFLOW AT LINE BOUNDARY TO FIT TOKEN BUDGET ...]";
              }
            }

            const promptParts = [
              "You are a Principal Systems Engineer and Rust Security Auditor conducting an in-depth code review for 'wstrace' (a zero-driver Windows system and Win32 API trace monitor written in 100% native Rust).",
              "",
              "Evaluate this Pull Request diff thoroughly against core systems engineering standards and the repository's AGENTS.md guidelines:",
              "1. Safety & Zero Production Panics: Reject raw .unwrap() in production execution paths. Require explicit error propagation (Result, ?) or documented .expect(\"invariant: ...\"). Ensure raw .unwrap() is used exclusively in tests (#[cfg(test)] or tests/).",
              "2. Win32 & Kernel ETW Invariants: Check deterministic closure of all Win32 handles (HANDLE, HMODULE, trace handles). Guard against handle leaks, verify NTSTATUS vs Win32 error code separation and severity bits, and check TOCTOU/buffer alignment.",
              "3. Module & Import Hygiene: Reject glob imports (use ...::*) in non-test modules. Explicit symbol imports are mandatory.",
              "4. Concurrency & Performance: Minimize shared ownership (avoid unnecessary Arc/Rc on hot capture paths; prioritize borrowing and std::sync::mpsc channels). Preserve zero-allocation string formatting on event loops.",
              "5. CLI & Documentation Parity: Ensure any modified CLI flag or option strictly matches src/cli.rs and has corresponding unit tests in tests/cli_tests.rs.",
              "",
              "Format your review in GitHub Markdown with the following clear sections:",
              "### 1. Executive Summary",
              "High-level overview of changes, architecture impact, and design decisions.",
              "",
              "### 2. Policy & Standards Verification",
              "- Zero Production unwrap(): [PASS / VIOLATION with exact file and line]",
              "- Explicit Imports (No Globs): [PASS / VIOLATION with exact file and line]",
              "- Win32 Handle & Resource Safety: [PASS / VIOLATION]",
              "- Channel & Concurrency Invariants: [PASS / VIOLATION]",
              "- CLI & Test Parity: [PASS / VIOLATION]",
              "",
              "### 3. Detailed Findings by Severity",
              "- Critical: Memory/handle leaks, thread panics, security flaws, concurrency data races, or data corruption.",
              "- Warning: Suboptimal Win32 API patterns, unhandled error cases, or hot-path allocation bottlenecks.",
              "- Nitpick / Idiomatic: Code style, Rust idiom enhancements, micro-optimizations, or documentation clarity.",
              "(If a severity category has no issues, explicitly state 'None identified'.)",
              "",
              "### 4. Actionable Code Suggestions",
              "For each warning or critical finding, provide exact GitHub suggestion diff blocks (```suggestion ... ```) so fixes can be applied directly via the GitHub UI.",
              "",
              "### 5. Verdict",
              "State clearly: **LGTM / Approved** or **Changes Requested** with concise technical justification.",
              "",
              "GIT DIFF:",
              "```diff",
              truncatedDiff,
              "```"
            ];
            const prompt = promptParts.join("\n");

            // 3. Call Gemini API with retries (Generous Free Tier: gemini-2.5-flash, gemini-2.0-flash, gemini-1.5-flash)
            const models = [
              'gemini-2.5-flash',
              'gemini-2.0-flash',
              'gemini-1.5-flash',
              'gemini-2.5-flash-lite',
              'gemini-3.8-flash',
              'gemini-3.5-flash'
            ];
            let reviewText = null;
            let usedModel = null;

            for (const model of models) {
              for (let attempt = 1; attempt <= 4; attempt++) {
                console.log(`Calling ${model} (attempt ${attempt})...`);
                try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        temperature: 0.1,
                        maxOutputTokens: 8192
                      }
                    })
                  });

                  if (response.ok) {
                    const data = await response.json();
                    const candidate = data.candidates?.[0];
                    const parts = candidate?.content?.parts || [];

                    // Filter out internal reasoning / thinking parts emitted by Gemini models
                    const contentParts = parts.filter(p => !p.thought && !p.thought_process);

                    if (contentParts.length > 0) {
                      reviewText = contentParts.map(p => p.text).filter(Boolean).join('\n').trim();
                    } else if (parts.length > 0) {
                      // Fallback if all parts had thought flag: take the last part
                      reviewText = parts[parts.length - 1]?.text?.trim();
                    }

                    // Strip any stray thinking/thought XML blocks if emitted as raw text
                    if (reviewText) {
                      reviewText = reviewText.replace(/<thought>[\s\S]*?<\/thought>/gi, '').trim();
                    }

                    if (reviewText) {
                      usedModel = model;
                      break;
                    } else {
                      const finishReason = candidate?.finishReason || "UNKNOWN";
                      console.log(`${model} returned HTTP 200 but no valid content parts. Finish reason: ${finishReason}`);
                      break;
                    }
                  } else if (response.status === 503 || response.status === 429) {
                    console.log(`${model} returned ${response.status} (spike/demand). Retrying in ${attempt * 4}s...`);
                    await new Promise(r => setTimeout(r, attempt * 4000));
                  } else {
                    const errText = await response.text();
                    console.log(`${model} returned ${response.status}: ${errText}. Trying next model...`);
                    break;
                  }
                } catch (fetchErr) {
                  console.log(`Network error calling ${model}: ${fetchErr.message}. Retrying...`);
                  await new Promise(r => setTimeout(r, attempt * 3000));
                }
              }
              if (reviewText) break;
            }

            if (!reviewText) {
              core.warning("Unable to generate review from Gemini API (upstream capacity spike). Step skipped gracefully.");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "⚠️ *Automated AI Code Review was temporarily skipped due to an upstream Google Gemini API capacity spike (HTTP 503/429). Codebase validation and CI checks are unaffected.*"
              });
              return;
            }

            const header = `### 🤖 Gemini AI Code Review (#${reviewIndex} - ${usedModel})\n\n`;

            const followUpTip = `\n\n> 💡 *Need another review? Comment \`@gemini review\` (max 3 reviews per 24h rolling window).*`;

            const footer = `\n\n---\n*Generated automatically by Google Gemini (${usedModel}) via GitHub Actions.*` + followUpTip;
            const finalBody = header + reviewText + footer;

            // 4. Post review comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: finalBody
            });

            console.log(`Successfully posted Gemini review #${reviewIndex} to PR #${context.issue.number}`);
