name: CI & Multi-Architecture Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests & Verification (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Code Formatting Check (rustfmt)
        run: cargo fmt --check
      - name: Static Analysis & Security Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Unit & Perf Tests
        run: cargo test --verbose

  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: wstrace-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wstrace.exe
