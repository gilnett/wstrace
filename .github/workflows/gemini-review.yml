name: Gemini AI PR Review

on:
  pull_request:
    types: [opened]
    branches: [ main ]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    name: Gemini Automated Code Review
    runs-on: ubuntu-latest
    if: >
      github.repository == 'gilnett/wstrace' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.comment.body, '@gemini review'))
      )
    steps:
      - name: Generate PR Review with Gemini
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log("No GEMINI_API_KEY found in secrets. Skipping review.");
              return;
            }

            // Acknowledge command comment with emoji reaction
            if (context.eventName === 'issue_comment' && context.payload.comment) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                });
              } catch (_) {}
            }

            // 1. Check review quota (max 3 reviews per PR)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previousReviews = comments.filter(c =>
              c.body && c.body.includes('Gemini AI Code Review')
            );

            const maxReviews = 3;
            const reviewIndex = previousReviews.length + 1;

            if (reviewIndex > maxReviews) {
              console.log(`Review quota reached (${previousReviews.length}/${maxReviews}). Skipping review.`);
              if (context.eventName === 'issue_comment') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `> [!NOTE]\n> **Gemini AI Review Quota Reached**: This Pull Request has already received its maximum of ${maxReviews} automated AI reviews (#${maxReviews}/${maxReviews}). Further automated reviews are disabled for this PR to conserve API resources.`
                });
              }
              return;
            }

            // 2. Fetch PR Diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            if (!diff || diff.length === 0) {
              console.log("Empty diff. Skipping review.");
              return;
            }

            // Filter out noise files (lockfiles, assets) to save tokens and focus on code
            const cleanedDiff = diff
              .split(/^diff --git /m)
              .filter(chunk => {
                if (!chunk) return false;
                const headerLine = chunk.split('\n')[0] || '';
                return !headerLine.includes('Cargo.lock') && !headerLine.includes('.svg') && !headerLine.includes('.zip');
              })
              .map(chunk => 'diff --git ' + chunk)
              .join('');

            const diffToReview = (cleanedDiff && cleanedDiff.length > 0) ? cleanedDiff : diff;
            const truncatedDiff = diffToReview.slice(0, 60000);

            const promptParts = [
              "You are an expert Rust systems programmer reviewing a Pull Request for 'wstrace' (a Windows system, Win32 API, and Process Monitor CLI written in native Rust).",
              "Review the following git diff carefully. Focus strictly on critical bugs, memory safety, concurrency, Win32 API edge cases, and performance regressions.",
              "",
              "Structure your response with:",
              "1. **Summary of Changes**: Concise summary of architectural and functional changes.",
              "2. **Code Quality & Rust Idioms**: Evaluation against modern Rust idioms, safety, error handling, and performance.",
              "3. **Potential Issues / Edge Cases**: Actionable feedback on bugs, leaks, or Win32 gotchas (or state 'None identified').",
              "4. **Verdict**: Clear recommendation (LGTM / Needs Attention).",
              "",
              "Keep your response concise, actionable, and formatted in GitHub Markdown.",
              "",
              "GIT DIFF:",
              "```diff",
              truncatedDiff,
              "```"
            ];
            const prompt = promptParts.join("\n");

            // 3. Call Gemini API with retries across active Gemini 3 generation models
            const models = [
              'gemini-3.8-flash',
              'gemini-3.7-flash',
              'gemini-3.6-flash',
              'gemini-3.5-flash',
              'gemini-3.5-flash-lite',
              'gemini-3.1-flash-lite'
            ];
            let reviewText = null;
            let usedModel = null;

            for (const model of models) {
              for (let attempt = 1; attempt <= 4; attempt++) {
                console.log(`Calling ${model} (attempt ${attempt})...`);
                try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        temperature: 0.1,
                        maxOutputTokens: 2048
                      }
                    })
                  });

                  if (response.ok) {
                    const data = await response.json();
                    const candidate = data.candidates?.[0];
                    reviewText = candidate?.content?.parts?.[0]?.text;
                    if (reviewText) {
                      usedModel = model;
                      break;
                    } else {
                      const finishReason = candidate?.finishReason || "UNKNOWN";
                      console.log(`${model} returned HTTP 200 but no text parts. Finish reason: ${finishReason}`);
                      break;
                    }
                  } else if (response.status === 503 || response.status === 429) {
                    console.log(`${model} returned ${response.status} (spike/demand). Retrying in ${attempt * 4}s...`);
                    await new Promise(r => setTimeout(r, attempt * 4000));
                  } else {
                    const errText = await response.text();
                    console.log(`${model} returned ${response.status}: ${errText}. Trying next model...`);
                    break;
                  }
                } catch (fetchErr) {
                  console.log(`Network error calling ${model}: ${fetchErr.message}. Retrying...`);
                  await new Promise(r => setTimeout(r, attempt * 3000));
                }
              }
              if (reviewText) break;
            }

            if (!reviewText) {
              core.warning("Unable to generate review from Gemini API (upstream capacity spike). Step skipped gracefully.");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "⚠️ *Automated AI Code Review was temporarily skipped due to an upstream Google Gemini API capacity spike (HTTP 503/429). Codebase validation and CI checks are unaffected.*"
              });
              return;
            }

            const header = `### 🤖 Gemini AI Code Review (#${reviewIndex}/${maxReviews} - ${usedModel})\n\n`;

            let followUpTip = "";
            if (reviewIndex < maxReviews) {
              followUpTip = `\n\n> 💡 *Need another review after pushing updates? Comment \`@gemini review\` to trigger review #${reviewIndex + 1}/${maxReviews}.*`;
            } else {
              followUpTip = `\n\n> ℹ️ *This is the final automated AI review for this Pull Request (#${maxReviews}/${maxReviews}).*`;
            }

            const footer = `\n\n---\n*Generated automatically by Google Gemini (${usedModel}) via GitHub Actions.*` + followUpTip;
            const finalBody = header + reviewText + footer;

            // 4. Post review comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: finalBody
            });

            console.log(`Successfully posted Gemini review #${reviewIndex}/${maxReviews} to PR #${context.issue.number}`);
