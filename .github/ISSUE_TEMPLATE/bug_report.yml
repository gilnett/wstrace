name: Bug Report
description: File a bug report for an unexpected behavior, crash, or tracing glitch.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in `wstrace`! Please provide all requested details below to help diagnose the problem quickly.

  - type: input
    id: version
    attributes:
      label: wstrace Version
      description: Run `wstrace --version` and paste the output here.
      placeholder: "wstrace 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which Windows version are you running?
      options:
        - Windows 11 24H2 / 23H2 (x86_64)
        - Windows 11 (ARM64 / Snapdragon X)
        - Windows 10 (21H2 / 22H2)
        - Windows Server 2022 / 2025
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command Executed
      description: What exact command did you run?
      placeholder: "wstrace run notepad.exe"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run 'wstrace run cmd.exe'
        2. Wait for process attach
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Trace Output
      description: Paste any console logs or JSON trace snippets here (wrap with ```).
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Security & Privacy Confirmation
      options:
        - label: I have verified that no private tokens, API keys, or confidential passwords are included in the logs.
          required: true
        - label: I have tested that this issue is reproducible on the latest release of wstrace.
          required: true
