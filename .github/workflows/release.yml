name: Automated Release Pipeline

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x86_64
          - target: aarch64-pc-windows-msvc
            arch_name: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Extract Version Tag
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          Write-Host "Detected tag: $tag"
          "version_tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Zip Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.version_tag }}"
          $dist = "dist-${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          
          $staging = "$dist/staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/wstrace.exe" "$staging/wstrace.exe"
          Copy-Item "README.md" "$staging/README.md"
          Copy-Item "LICENSE" "$staging/LICENSE"
          
          $zipName = "wstrace-$tag-windows-${{ matrix.arch_name }}.zip"
          $zipPath = "$dist/$zipName"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath -Force
          Remove-Item -Path $staging -Recurse -Force
          
          # Compute SHA-256
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$dist/checksum.txt" -Encoding ascii
          Write-Host "Archive created: $zipName with SHA256: $hash"

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.arch_name }}
          path: dist-${{ matrix.arch_name }}/*

  create-draft-release:
    name: Create Draft Release (Human Verification Gate)
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - uses: actions/checkout@v7

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Aggregate Checksums and Organize Assets
        shell: bash
        run: |
          mkdir -p final-assets
          find release-assets/ -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -name "checksum.txt" -exec cat {} + > final-assets/SHA256SUMS.txt
          cat final-assets/SHA256SUMS.txt

      - name: Extract Tag Name
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "wstrace ${{ steps.release_tag.outputs.tag }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*.zip
            final-assets/SHA256SUMS.txt
