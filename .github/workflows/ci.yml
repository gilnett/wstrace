name: CI & Multi-Architecture Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Security Audit (RustSec CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run Security Audit
        run: cargo audit --deny warnings

  test-and-lint:
    name: Tests & Verification (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Complete Quality & Security Audit Suite
        shell: pwsh
        run: ./scripts/audit.ps1

  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    needs: test-and-lint
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: wstrace-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wstrace.exe
