<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Trace Beam Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Grid / Radar Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Squircle Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#chassisShadow)"/>

  <!-- Radar / Telemetry Background Grid -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <!-- Concentric radar circles -->
    <circle cx="256" cy="230" r="140" fill="none"/>
    <circle cx="256" cy="230" r="95" fill="none"/>
    <circle cx="256" cy="230" r="50" fill="none"/>
    <!-- Axis lines -->
    <line x1="116" y1="230" x2="396" y2="230"/>
    <line x1="256" y1="90" x2="256" y2="370"/>
  </g>

  <!-- 4-Pane Windows Silhouette (Subtle Glassmorphism background) -->
  <g opacity="0.22">
    <!-- Top-Left Pane -->
    <rect x="170" y="145" width="76" height="76" rx="10" fill="#38BDF8"/>
    <!-- Top-Right Pane -->
    <rect x="266" y="145" width="76" height="76" rx="10" fill="#60A5FA"/>
    <!-- Bottom-Left Pane -->
    <rect x="170" y="239" width="76" height="76" rx="10" fill="#818CF8"/>
    <!-- Bottom-Right Pane -->
    <rect x="266" y="239" width="76" height="76" rx="10" fill="#A78BFA"/>
  </g>

  <!-- Central "W" Syscall Wave Pulse (The Core Identity) -->
  <!-- Represents: Baseline -> System Call Entry -> Kernel Intercept -> Return -> Exit -->
  <path d="M 64,230 
           L 136,230 
           L 164,295 
           L 204,135 
           L 240,265 
           L 272,135 
           L 308,295 
           L 348,175 
           L 376,230 
           L 448,230" 
        fill="none" 
        stroke="url(#traceGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Probe Target Reticle / Interception Focal Points -->
  <!-- Peak 1 (Syscall entry) -->
  <circle cx="204" cy="135" r="4.5" fill="#FFFFFF"/>
  <circle cx="204" cy="135" r="9" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>

  <!-- Peak 2 (Kernel resolution) -->
  <circle cx="272" cy="135" r="4.5" fill="#FFFFFF"/>
  <circle cx="272" cy="135" r="9" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.8"/>

  <!-- Telemetry Baseline Pulses (Digital Signal Dots) -->
  <circle cx="100" cy="230" r="3" fill="#00F0FF" opacity="0.7"/>
  <circle cx="412" cy="230" r="3" fill="#C084FC" opacity="0.7"/>

  <!-- Typography / Brandmark at bottom -->
  <g text-anchor="middle">
    <!-- "wstrace" wordmark -->
    <text x="256" y="420" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Cascadia Code', monospace" 
          font-size="36" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#F8FAFC">
      ws<tspan fill="#00F0FF">trace</tspan>
    </text>

    <!-- Subtitle badge -->
    <text x="256" y="445" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Cascadia Code', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#64748B">
      WINDOWS SYSCALL MONITOR
    </text>
  </g>
</svg>
